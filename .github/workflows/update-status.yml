name: Status aktualisieren

on:
  schedule:
    # Alle 5 Minuten - das von GitHub empfohlene Minimum fuer verlaessliche
    # Ausloesung. Engere Takte (z. B. */2) werden von GitHub teils schlicht
    # ignoriert, ohne Fehlermeldung.
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/servers.json"
      - "scripts/query_servers.py"
      - ".github/workflows/update-status.yml"

concurrency:
  group: update-status-b
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Server abfragen
        run: python scripts/query_servers.py

      - name: status.json committen, falls geaendert
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHANGED=$(python3 - <<'PY'
          import json, subprocess
          from datetime import datetime
          new = json.load(open("docs/status.json"))
          try:
              old = json.loads(subprocess.check_output(["git", "show", "HEAD:docs/status.json"]))
          except Exception:
              print("yes")
              raise SystemExit
          ng = new.pop("generated_at", None)
          og = old.pop("generated_at", None)
          if new != old:
              print("yes")
              raise SystemExit
          age = (datetime.fromisoformat(ng) - datetime.fromisoformat(og)).total_seconds() / 60
          print("yes" if age >= 5 else "no")
          PY
          )
          if [ "$CHANGED" = "yes" ]; then
            git add docs/status.json
            git commit -m "Status aktualisiert: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Keine Aenderung am Status."
          fi

      - name: Naechsten Lauf in 90 Sekunden selbst anstossen
        # Umgeht GitHubs eigenen (bei neuen Repos teils unzuverlaessigen)
        # "schedule"-Mechanismus komplett: dieser Lauf wartet 90 Sekunden und
        # loest sich danach per API selbst erneut aus. Laeuft so lange
        # weiter, wie jeder Lauf erfolgreich den naechsten anstoesst - "if:
        # always()" sorgt dafuer, dass das auch nach einem Fehler in einem
        # vorherigen Schritt noch passiert, damit die Kette nicht abreisst.
        # Bei einem oeffentlichen Repo sind GitHub-Actions-Minuten
        # unbegrenzt kostenlos, daher spricht nichts gegen diesen engen Takt.
        if: always()
        run: |
          sleep 90
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-status.yml/dispatches" \
            -d '{"ref":"main"}'
