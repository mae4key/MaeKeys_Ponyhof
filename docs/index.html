<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaeKeys Ponyhof – Server Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1d15;
    --panel: #242819;
    --panel-line: #41452c;
    --brass: #c9a84c;
    --field-green: #6f8458;
    --online: #8aab5e;
    --offline: #9a5a46;
    --text: #ece4cc;
    --text-dim: #a9a186;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    padding: 2.5rem 0.75rem 4rem;
    position: relative;
  }

  .bg-photo {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 0;
    background-image: url("assets/bg-church.jpg");
    background-repeat: no-repeat;
    background-size: 100% auto;
    background-position: 50% center;
  }

  .bg-overlay {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(111,132,88,0.12), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(201,168,76,0.08), transparent 40%),
      linear-gradient(rgba(27,29,21,0.55), rgba(27,29,21,0.68));
  }

  /* Auf mobilen Bildschirmen etwas breiter als der Viewport rendern, damit
     beim Scrollen horizontal "Spielraum" zum Schwenken entsteht. */
  @media (max-width: 640px) {
    .bg-photo {
      background-size: 230% auto;
    }
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    position: relative;
    z-index: 2;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.75rem;
    margin-bottom: 2.5rem;
  }

  .mascot { width: 168px; height: auto; }

  h1 {
    font-family: "Staatliches", sans-serif;
    font-weight: 400;
    letter-spacing: 0.06em;
    font-size: clamp(2rem, 7vw, 2.8rem);
    margin: 0;
    color: var(--brass);
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin: 0;
  }

  .timestamp {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    border-top: 1px dashed var(--panel-line);
    padding-top: 0.5rem;
    width: 100%;
    max-width: 360px;
  }

  .servers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.6rem;
  }

  .empty { grid-column: 1 / -1; }

  .card {
    position: relative;
    background: rgba(36, 40, 25, 0.62);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    border: 1px solid var(--panel-line);
    border-left: 4px solid var(--field-green);
    padding: 0.7rem 0.75rem;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }

  .card.offline { border-left-color: var(--offline); opacity: 0.72; }

  .card-top {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .game-name {
    font-family: "Staatliches", sans-serif;
    letter-spacing: 0.04em;
    font-size: 0.92rem;
    color: var(--text);
    line-height: 1.2;
    text-decoration: none;
    background: none;
    border: none;
    border-bottom: 1px dotted var(--brass);
    padding: 0;
    cursor: pointer;
    font-weight: inherit;
  }

  .game-name:hover,
  .game-name:focus {
    color: var(--brass);
  }

  .modal-backdrop {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 10;
    background: rgba(10, 11, 7, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .modal-backdrop[hidden] { display: none; }

  .modal-box {
    background: #1f2315;
    border: 1px solid var(--panel-line);
    border-left: 4px solid var(--brass);
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 1.1rem 1.2rem;
  }

  .modal-box h2 {
    font-family: "Staatliches", sans-serif;
    letter-spacing: 0.04em;
    color: var(--brass);
    margin: 0 0 0.2rem;
    font-size: 1.2rem;
  }

  .modal-box .modal-sub {
    color: var(--text-dim);
    font-size: 0.75rem;
    margin: 0 0 0.9rem;
  }

  table.scoreboard {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.75rem;
  }

  table.scoreboard th {
    text-align: left;
    color: var(--text-dim);
    font-weight: normal;
    border-bottom: 1px solid var(--panel-line);
    padding: 0.25rem 0.4rem;
  }

  table.scoreboard td {
    padding: 0.25rem 0.4rem;
    border-bottom: 1px dashed var(--panel-line);
  }

  .bot-summary {
    margin: 0.6rem 0 0;
    color: var(--text-dim);
    font-size: 0.78rem;
  }

  .modal-empty {
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  .modal-close {
    display: block;
    margin: 1rem auto 0;
    background: none;
    border: 1px solid var(--panel-line);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 0.75rem;
    padding: 0.4rem 1rem;
    cursor: pointer;
  }

  .modal-close:hover { color: var(--text); border-color: var(--brass); }

  .tag {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    padding: 0.15rem 0.5rem;
    border: 1px solid currentColor;
  }

  .tag.online { color: var(--online); }
  .tag.offline { color: var(--offline); }

  dl.meta {
    margin: 0.55rem 0 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.2rem 0.5rem;
    font-size: 0.74rem;
  }

  dl.meta dt { color: var(--text-dim); }
  dl.meta dd { margin: 0; }

  .empty {
    text-align: center;
    padding: 2.5rem 1rem;
    border: 1px dashed var(--panel-line);
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .empty strong {
    display: block;
    font-family: "Staatliches", sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.04em;
    color: var(--brass);
    margin-bottom: 0.4rem;
  }

  .stale-notice {
    margin-top: 1.5rem;
    font-size: 0.75rem;
    color: var(--offline);
    text-align: center;
  }
</style>
</head>
<body>
<div class="bg-photo" id="bg-photo"></div>
<div class="bg-overlay"></div>
<div class="wrap">
  <div class="hero">
    <svg class="mascot" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pony mascot in camo with steel helmet and rifle">
      <defs>
        <clipPath id="bodyClip">
          <path d="M 60 120
                   C 55 95, 75 78, 105 76
                   L 185 80
                   C 205 82, 216 96, 214 112
                   C 213 128, 200 136, 182 136
                   L 76 136
                   C 66 136, 61 130, 60 120 Z"/>
        </clipPath>
        <clipPath id="neckClip">
          <path d="M 98 80
                   C 90 62, 80 48, 58 40
                   C 70 36, 86 38, 98 48
                   C 108 56, 112 70, 112 82 Z"/>
        </clipPath>
      </defs>
      <ellipse cx="120" cy="178" rx="78" ry="9" fill="#000" opacity="0.3"/>
      <!-- Schweif -->
      <path d="M 196 95
               C 222 100, 228 125, 214 145
               C 206 157, 190 158, 184 150
               C 196 146, 204 130, 198 115
               C 195 108, 190 102, 184 98 Z" fill="#6b4a33"/>
      <!-- Hinterbeine -->
      <rect x="178" y="118" width="13" height="48" rx="5" fill="#caa06a"/>
      <rect x="200" y="118" width="13" height="48" rx="5" fill="#caa06a"/>
      <rect x="176" y="160" width="17" height="10" rx="3" fill="#3a2e22"/>
      <rect x="198" y="160" width="17" height="10" rx="3" fill="#3a2e22"/>
      <!-- Vorderbeine -->
      <rect x="62" y="118" width="13" height="48" rx="5" fill="#caa06a"/>
      <rect x="84" y="118" width="13" height="48" rx="5" fill="#caa06a"/>
      <rect x="60" y="160" width="17" height="10" rx="3" fill="#3a2e22"/>
      <rect x="82" y="160" width="17" height="10" rx="3" fill="#3a2e22"/>
      <!-- Koerper -->
      <path d="M 60 120
               C 55 95, 75 78, 105 76
               L 185 80
               C 205 82, 216 96, 214 112
               C 213 128, 200 136, 182 136
               L 76 136
               C 66 136, 61 130, 60 120 Z" fill="#caa06a"/>
      <!-- Tarnmuster Rumpf -->
      <g clip-path="url(#bodyClip)">
        <ellipse cx="90" cy="100" rx="22" ry="13" fill="#5b6a44" transform="rotate(-12 90 100)"/>
        <ellipse cx="140" cy="92" rx="26" ry="14" fill="#4a3f2c" transform="rotate(8 140 92)"/>
        <ellipse cx="185" cy="108" rx="20" ry="12" fill="#5b6a44" transform="rotate(-18 185 108)"/>
        <ellipse cx="110" cy="125" rx="18" ry="10" fill="#4a3f2c" transform="rotate(14 110 125)"/>
        <ellipse cx="160" cy="128" rx="22" ry="11" fill="#6f7a4f" transform="rotate(-6 160 128)"/>
        <ellipse cx="68" cy="108" rx="14" ry="9" fill="#4a3f2c" transform="rotate(20 68 108)"/>
      </g>
      <!-- Hals -->
      <path d="M 98 80
               C 90 62, 80 48, 58 40
               C 70 36, 86 38, 98 48
               C 108 56, 112 70, 112 82 Z" fill="#caa06a"/>
      <!-- Tarnmuster Hals -->
      <g clip-path="url(#neckClip)">
        <ellipse cx="90" cy="55" rx="14" ry="9" fill="#5b6a44" transform="rotate(-20 90 55)"/>
        <ellipse cx="100" cy="72" rx="12" ry="8" fill="#4a3f2c" transform="rotate(10 100 72)"/>
      </g>
      <!-- Kopf -->
      <path d="M 58 40
               C 44 36, 30 42, 22 56
               C 16 66, 18 78, 26 86
               C 32 92, 42 94, 50 90
               C 62 85, 70 72, 70 58
               C 70 50, 65 43, 58 40 Z" fill="#caa06a"/>
      <ellipse cx="24" cy="78" rx="7" ry="5" fill="#b78d57"/>
      <circle cx="20" cy="78" r="1.8" fill="#2a2016"/>
      <circle cx="44" cy="60" r="3.6" fill="#2a2016"/>
      <circle cx="45.3" cy="58.7" r="1" fill="#fff" opacity="0.8"/>
      <!-- Maehne: fliessende Straehnen im Nacken -->
      <path d="M 72 40
               C 90 42, 104 52, 110 68
               C 104 66, 96 62, 90 58
               C 96 68, 100 80, 98 92
               C 90 84, 84 74, 80 64
               C 82 74, 82 84, 78 94
               C 70 84, 66 72, 66 60
               C 66 52, 68 45, 72 40 Z" fill="#6b4a33"/>
      <!-- Stahlhelm (WW2): deckt den Kopf komplett, nur der Riemen ist sichtbar -->
      <path d="M 18 50
               C 20 27, 42 11, 66 14
               C 84 17, 94 30, 92 42
               C 92 46, 88 48, 84 46
               C 64 36, 38 36, 22 52
               C 18 54, 16 52, 18 50 Z" fill="#5b6a44" stroke="#394227" stroke-width="2"/>
      <path d="M 16 51 C 38 37, 66 37, 88 48 L 90 54 C 66 43, 38 43, 18 57 Z" fill="#48542f"/>
      <path d="M 30 48 C 34 60, 34 72, 28 82" stroke="#394227" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Gewehr: Kar98k-artige Silhouette (Schaft, Verschluss, Lauf, Kammerstengel, Korn) -->
      <g transform="translate(46,133) rotate(-30)">
        <path d="M 0 10 L 0 22 L 14 25 L 36 15 L 36 9 L 16 3 Z" fill="#6b4a33" stroke="#4a3220" stroke-width="1"/>
        <rect x="34" y="8" width="20" height="11" rx="1.5" fill="#3a3a30"/>
        <circle cx="44" cy="20" r="3.4" fill="#3a3a30"/>
        <rect x="52" y="11" width="108" height="5" rx="1.5" fill="#3a3a30"/>
        <rect x="154" y="7" width="4" height="9" fill="#2a2a24"/>
        <path d="M 40 19 q 4 8 -2 10" stroke="#3a3a30" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
    <h1>MaeKeys Ponyhof</h1>
    <p class="subtitle">Live status of the retro game servers</p>
  </div>

  <div id="servers" class="servers">
    <p class="empty"><strong>Loading status …</strong></p>
  </div>

  <p class="timestamp" id="timestamp"></p>
  <p class="stale-notice" id="stale-notice" hidden></p>
</div>

<div class="modal-backdrop" id="modal-backdrop" hidden onclick="if(event.target===this) closeScoreboard()">
  <div class="modal-box">
    <h2 id="modal-title"></h2>
    <p class="modal-sub" id="modal-sub"></p>
    <div id="modal-body"></div>
    <button type="button" class="modal-close" onclick="closeScoreboard()">Close</button>
  </div>
</div>

<script>
function fmtTimestamp(iso) {
  if (!iso) return "No update yet.";
  const d = new Date(iso);
  return "Last updated: " + d.toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" });
}

let currentServers = {};

function renderServers(servers) {
  const el = document.getElementById("servers");
  const online = servers.filter(s => s.status === "online");
  currentServers = {};
  online.forEach(s => { currentServers[s.id] = s; });

  if (online.length === 0) {
    el.innerHTML = `<p class="empty"><strong>No game currently running</strong>All servers are currently offline or unreachable.</p>`;
    return;
  }

  el.innerHTML = online.map(s => `
    <div class="card">
      <div class="card-top">
        <button type="button" class="game-name" data-id="${s.id}" onclick="showScoreboard(this.dataset.id)">${s.game}</button>
        <span class="tag online">ONLINE</span>
      </div>
      <dl class="meta">
        <dt>Server</dt><dd>${s.mod ? s.name + " – " + s.mod : s.name}</dd>
        <dt>Map</dt><dd>${s.map || "–"}</dd>
        <dt>Mode</dt><dd>${s.mode || "–"}</dd>
        <dt>Players</dt><dd>${s.map ? s.players + (s.max_players ? " / " + s.max_players : "") : "–"}</dd>
      </dl>
    </div>
  `).join("");
}

async function load() {
  try {
    const res = await fetch("status.json", { cache: "no-store" });
    const data = await res.json();
    renderServers(data.servers || []);
    document.getElementById("timestamp").textContent = fmtTimestamp(data.generated_at);

    const staleNotice = document.getElementById("stale-notice");
    if (data.generated_at) {
      const ageMinutes = (Date.now() - new Date(data.generated_at)) / 60000;
      if (ageMinutes > 5) {
        staleNotice.hidden = false;
        staleNotice.textContent = "Note: the last update was over 5 minutes ago – data may be outdated.";
      }
    }
  } catch (e) {
    document.getElementById("servers").innerHTML =
      `<p class="empty"><strong>Status currently unavailable</strong>Please try again later.</p>`;
  }
}

load();

// Scoreboard-Detailfenster: zeigt nur unsere eigenen Abfragedaten, kein
// externer Link.
function showScoreboard(id) {
  const s = currentServers[id];
  if (!s) return;
  document.getElementById("modal-title").textContent = s.game;
  document.getElementById("modal-sub").textContent =
    (s.mod ? s.name + " – " + s.mod : s.name) +
    (s.map ? " · " + s.map : "") +
    (s.mode ? " · " + s.mode : "");

  const body = document.getElementById("modal-body");
  const hasPlayers = s.scoreboard && s.scoreboard.length > 0;
  const hasBots = s.bot_count && s.bot_count > 0;

  if (!hasPlayers && !hasBots) {
    body.innerHTML = `<p class="modal-empty">No players currently online.</p>`;
  } else {
    let html = "";
    if (hasPlayers) {
      const rows = s.scoreboard.map(p => `
        <tr>
          <td>${p.name}</td>
          <td>${p.team || "–"}</td>
          <td>${p.rank || "–"}</td>
          <td>${p.score}</td>
          <td>${p.kills}</td>
          <td>${p.deaths}</td>
          <td>${p.ping}</td>
        </tr>
      `).join("");
      html += `
        <table class="scoreboard">
          <thead><tr><th>Name</th><th>Team</th><th>Rank</th><th>Score</th><th>Kills</th><th>Deaths</th><th>Ping</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
    if (hasBots) {
      html += `<p class="bot-summary">+ ${s.bot_count} bot${s.bot_count === 1 ? "" : "s"} (not listed individually by the server)</p>`;
    }
    body.innerHTML = html;
  }

  document.getElementById("modal-backdrop").hidden = false;
}

function closeScoreboard() {
  document.getElementById("modal-backdrop").hidden = true;
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeScoreboard();
});

// Hintergrundbild beim Scrollen gleichmaessig von links nach rechts
// schwenken - nur auf schmalen (mobilen) Bildschirmen aktiv.
function initBackgroundPan() {
  const bg = document.getElementById("bg-photo");
  const isMobile = window.matchMedia("(max-width: 640px)").matches;
  if (!isMobile) {
    bg.style.backgroundPositionX = "50%";
    return;
  }

  function updatePan() {
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    const progress = maxScroll > 0 ? Math.min(1, Math.max(0, window.scrollY / maxScroll)) : 0;
    bg.style.backgroundPositionX = (progress * 100) + "%";
  }

  updatePan();
  window.addEventListener("scroll", updatePan, { passive: true });
  window.addEventListener("resize", updatePan);
}

initBackgroundPan();
</script>
</body>
</html>
