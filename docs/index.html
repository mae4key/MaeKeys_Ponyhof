<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaeKeys Ponyhof – Server-Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1d15;
    --panel: #242819;
    --panel-line: #41452c;
    --brass: #c9a84c;
    --field-green: #6f8458;
    --online: #8aab5e;
    --offline: #9a5a46;
    --text: #ece4cc;
    --text-dim: #a9a186;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
  }

  body {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    padding: 2.5rem 0.75rem 4rem;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(111,132,88,0.12), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(201,168,76,0.08), transparent 40%);
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 0.75rem;
    margin-bottom: 2.5rem;
  }

  .mascot { width: 168px; height: auto; }

  h1 {
    font-family: "Staatliches", sans-serif;
    font-weight: 400;
    letter-spacing: 0.06em;
    font-size: clamp(2rem, 7vw, 2.8rem);
    margin: 0;
    color: var(--brass);
    text-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    margin: 0;
  }

  .timestamp {
    margin-top: 0.5rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    border-top: 1px dashed var(--panel-line);
    padding-top: 0.5rem;
    width: 100%;
    max-width: 360px;
  }

  .servers {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.6rem;
  }

  .empty { grid-column: 1 / -1; }

  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-left: 4px solid var(--field-green);
    padding: 0.7rem 0.75rem;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
  }

  .card.offline { border-left-color: var(--offline); opacity: 0.72; }

  .card-top {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .game-name {
    font-family: "Staatliches", sans-serif;
    letter-spacing: 0.04em;
    font-size: 0.92rem;
    color: var(--text);
    line-height: 1.2;
  }

  .tag {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    padding: 0.15rem 0.5rem;
    border: 1px solid currentColor;
  }

  .tag.online { color: var(--online); }
  .tag.offline { color: var(--offline); }

  dl.meta {
    margin: 0.55rem 0 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.2rem 0.5rem;
    font-size: 0.74rem;
  }

  dl.meta dt { color: var(--text-dim); }
  dl.meta dd { margin: 0; }

  .empty {
    text-align: center;
    padding: 2.5rem 1rem;
    border: 1px dashed var(--panel-line);
    color: var(--text-dim);
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .empty strong {
    display: block;
    font-family: "Staatliches", sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.04em;
    color: var(--brass);
    margin-bottom: 0.4rem;
  }

  .stale-notice {
    margin-top: 1.5rem;
    font-size: 0.75rem;
    color: var(--offline);
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <svg class="mascot" viewBox="0 0 240 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pony-Maskottchen mit Stahlhelm und Gewehr">
      <ellipse cx="120" cy="178" rx="78" ry="9" fill="#000" opacity="0.3"/>
      <!-- Schweif -->
      <path d="M 196 95
               C 222 100, 228 125, 214 145
               C 206 157, 190 158, 184 150
               C 196 146, 204 130, 198 115
               C 195 108, 190 102, 184 98 Z" fill="#6b4a33"/>
      <!-- Hinterbeine -->
      <rect x="178" y="118" width="13" height="48" rx="5" fill="#caa06a"/>
      <rect x="200" y="118" width="13" height="48" rx="5" fill="#caa06a"/>
      <rect x="176" y="160" width="17" height="10" rx="3" fill="#3a2e22"/>
      <rect x="198" y="160" width="17" height="10" rx="3" fill="#3a2e22"/>
      <!-- Vorderbeine -->
      <rect x="62" y="118" width="13" height="48" rx="5" fill="#caa06a"/>
      <rect x="84" y="118" width="13" height="48" rx="5" fill="#caa06a"/>
      <rect x="60" y="160" width="17" height="10" rx="3" fill="#3a2e22"/>
      <rect x="82" y="160" width="17" height="10" rx="3" fill="#3a2e22"/>
      <!-- Koerper -->
      <path d="M 60 120
               C 55 95, 75 78, 105 76
               L 185 80
               C 205 82, 216 96, 214 112
               C 213 128, 200 136, 182 136
               L 76 136
               C 66 136, 61 130, 60 120 Z" fill="#caa06a"/>
      <!-- Hals -->
      <path d="M 98 80
               C 90 62, 80 48, 58 40
               C 70 36, 86 38, 98 48
               C 108 56, 112 70, 112 82 Z" fill="#caa06a"/>
      <!-- Kopf -->
      <path d="M 58 40
               C 44 36, 30 42, 22 56
               C 16 66, 18 78, 26 86
               C 32 92, 42 94, 50 90
               C 62 85, 70 72, 70 58
               C 70 50, 65 43, 58 40 Z" fill="#caa06a"/>
      <ellipse cx="24" cy="78" rx="7" ry="5" fill="#b78d57"/>
      <circle cx="20" cy="78" r="1.8" fill="#2a2016"/>
      <circle cx="44" cy="60" r="3.6" fill="#2a2016"/>
      <circle cx="45.3" cy="58.7" r="1" fill="#fff" opacity="0.8"/>
      <!-- Maehne: fliessende Straehnen im Nacken -->
      <path d="M 72 40
               C 90 42, 104 52, 110 68
               C 104 66, 96 62, 90 58
               C 96 68, 100 80, 98 92
               C 90 84, 84 74, 80 64
               C 82 74, 82 84, 78 94
               C 70 84, 66 72, 66 60
               C 66 52, 68 45, 72 40 Z" fill="#6b4a33"/>
      <!-- Stahlhelm (WW2): deckt den Kopf komplett, nur der Riemen ist sichtbar -->
      <path d="M 18 50
               C 20 27, 42 11, 66 14
               C 84 17, 94 30, 92 42
               C 92 46, 88 48, 84 46
               C 64 36, 38 36, 22 52
               C 18 54, 16 52, 18 50 Z" fill="#5b6a44" stroke="#394227" stroke-width="2"/>
      <path d="M 16 51 C 38 37, 66 37, 88 48 L 90 54 C 66 43, 38 43, 18 57 Z" fill="#48542f"/>
      <path d="M 30 48 C 34 60, 34 72, 28 82" stroke="#394227" stroke-width="3" fill="none" stroke-linecap="round"/>
      <!-- Gewehr -->
      <g stroke="#3a3a30" stroke-width="6" stroke-linecap="round">
        <line x1="52" y1="130" x2="192" y2="48"/>
      </g>
      <rect x="168" y="52" width="26" height="9" rx="2" fill="#3a3a30" transform="rotate(-30 181 56)"/>
      <rect x="50" y="118" width="20" height="10" rx="2" fill="#6b4a33" transform="rotate(-30 60 123)"/>
    </svg>
    <h1>MaeKeys Ponyhof</h1>
    <p class="subtitle">Live-Status der Retrogame-Server</p>
  </div>

  <div id="servers" class="servers">
    <p class="empty"><strong>Lade Status …</strong></p>
  </div>

  <p class="timestamp" id="timestamp"></p>
  <p class="stale-notice" id="stale-notice" hidden></p>
</div>

<script>
function fmtTimestamp(iso) {
  if (!iso) return "Noch kein Durchlauf erfolgt.";
  const d = new Date(iso);
  return "Stand: " + d.toLocaleString("de-CH", { dateStyle: "medium", timeStyle: "short" });
}

function renderServers(servers) {
  const el = document.getElementById("servers");
  const online = servers.filter(s => s.status === "online");

  if (online.length === 0) {
    el.innerHTML = `<p class="empty"><strong>Aktuell läuft kein Spiel</strong>Alle Server sind gerade ausgeschaltet oder nicht erreichbar.</p>`;
    return;
  }

  el.innerHTML = online.map(s => `
    <div class="card">
      <div class="card-top">
        <span class="game-name">${s.game}</span>
        <span class="tag online">ONLINE</span>
      </div>
      <dl class="meta">
        <dt>Server</dt><dd>${s.mod ? s.name + " – " + s.mod : s.name}</dd>
        <dt>Map</dt><dd>${s.map || "–"}</dd>
        <dt>Modus</dt><dd>${s.mode || "–"}</dd>
        <dt>Spieler</dt><dd>${s.players}${s.max_players ? " / " + s.max_players : ""}</dd>
      </dl>
    </div>
  `).join("");
}

async function load() {
  try {
    const res = await fetch("status.json", { cache: "no-store" });
    const data = await res.json();
    renderServers(data.servers || []);
    document.getElementById("timestamp").textContent = fmtTimestamp(data.generated_at);

    const staleNotice = document.getElementById("stale-notice");
    if (data.generated_at) {
      const ageMinutes = (Date.now() - new Date(data.generated_at)) / 60000;
      if (ageMinutes > 20) {
        staleNotice.hidden = false;
        staleNotice.textContent = "Hinweis: Der letzte Abruf liegt über 20 Minuten zurück – Daten könnten veraltet sein.";
      }
    }
  } catch (e) {
    document.getElementById("servers").innerHTML =
      `<p class="empty"><strong>Status momentan nicht verfügbar</strong>Bitte später erneut versuchen.</p>`;
  }
}

load();
</script>
</body>
</html>
